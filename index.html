<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voof Hunter — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #2d2118;
      background: #f4ede4;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(247, 241, 233, 0.98) 0%,
          rgba(247, 241, 233, 0.95) 34%,
          rgba(247, 241, 233, 0.68) 51%,
          rgba(247, 241, 233, 0.10) 72%,
          rgba(247, 241, 233, 0.00) 100%
        ),
        url("voofhunter-hero.png") center right / cover no-repeat;
    }

    .nav {
      position: relative;
      z-index: 2;
      height: 94px;
      padding: 0 6.8vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(79, 57, 39, 0.12);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 2.5vw, 42px);
      font-weight: 400;
    }

    .nav-note {
      font-size: 11px;
      line-height: 1.7;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: right;
      color: rgba(45, 33, 24, 0.72);
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - 94px);
      padding: 9vh 6.8vw 7vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .copy {
      width: min(680px, 53vw);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      font-size: 11px;
      letter-spacing: 3.4px;
      text-transform: uppercase;
      color: #a88e77;
    }

    .eyebrow::before {
      content: "";
      width: 62px;
      height: 1px;
      background: #9d836d;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(62px, 6.8vw, 112px);
      line-height: 0.92;
      letter-spacing: -4px;
      margin-bottom: 26px;
    }

    .subtitle {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 1.75vw, 30px);
      line-height: 1.45;
      color: #6f5b4b;
      max-width: 650px;
    }

    .coming-soon {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 34px;
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #5d402a;
    }

    .coming-soon::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8e6848;
      box-shadow: 0 0 0 8px rgba(142, 104, 72, 0.10);
    }

    .side-note {
      position: absolute;
      z-index: 2;
      right: 6.5vw;
      top: 41%;
      font-size: 11px;
      line-height: 2.1;
      letter-spacing: 3.3px;
      text-transform: uppercase;
      color: rgba(64, 47, 34, 0.74);
    }

    .side-note::after {
      content: "";
      display: block;
      width: 62px;
      height: 1px;
      background: rgba(85, 62, 43, 0.45);
      margin-top: 18px;
    }

    .footer-note {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      font-size: 11px;
      letter-spacing: 2.8px;
      line-height: 1.7;
      text-transform: uppercase;
      color: rgba(64, 47, 34, 0.72);
    }

    .footer-note .left::before {
      content: "";
      display: block;
      width: 50px;
      height: 1px;
      margin-bottom: 14px;
      background: rgba(85, 62, 43, 0.45);
    }

    @media (max-width: 900px) {
      .hero {
        background:
          linear-gradient(
            180deg,
            rgba(247, 241, 233, 0.98) 0%,
            rgba(247, 241, 233, 0.96) 40%,
            rgba(247, 241, 233, 0.60) 61%,
            rgba(247, 241, 233, 0.12) 80%
          ),
          url("voofhunter-hero.png") 68% center / cover no-repeat;
      }

      .nav {
        height: 76px;
        padding: 0 24px;
      }

      .nav-note,
      .side-note {
        display: none;
      }

      .content {
        min-height: calc(100vh - 76px);
        padding: 54px 24px 28px;
      }

      .copy {
        width: 100%;
        max-width: 620px;
      }

      h1 {
        font-size: clamp(52px, 14vw, 80px);
        line-height: 0.95;
        letter-spacing: -2.5px;
      }

      .subtitle {
        font-size: 20px;
        max-width: 520px;
      }

      .coming-soon {
        font-size: 18px;
        letter-spacing: 4px;
      }
    }

    @media (max-width: 520px) {
      .hero {
        background:
          linear-gradient(
            180deg,
            rgba(247, 241, 233, 1) 0%,
            rgba(247, 241, 233, 0.98) 44%,
            rgba(247, 241, 233, 0.68) 66%,
            rgba(247, 241, 233, 0.14) 88%
          ),
          url("voofhunter-hero.png") 70% center / cover no-repeat;
      }

      h1 {
        font-size: 54px;
      }

      .subtitle {
        font-size: 18px;
      }

      .footer-note {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="hero">

    <header class="nav">
      <div class="brand">Voof Hunter</div>

      <div class="nav-note">
        Natural Nutrition<br />
        For a Wilder Life
      </div>
    </header>

    <section class="content">

      <div class="copy">
        <div class="eyebrow">Pets Live Braver Lives</div>

        <h1>
          Born to Hunt.<br />
          Made for More.
        </h1>

        <p class="subtitle">
          Premium pet food & lifestyle, coming soon.
        </p>

        <div class="coming-soon">
          Coming Soon
        </div>
      </div>

      <div class="footer-note">
        <div class="left">
          Good Food<br />
          Brings a Brighter Tomorrow.
        </div>

        <div>
          voofhunter.com
        </div>
      </div>

    </section>

    <div class="side-note">
      Natural<br />
      Balanced<br />
      Braver Lives
    </div>

  </main>
</body>
</html>
