<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voof Hunter — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(205, 174, 132, 0.20), transparent 35%),
        linear-gradient(135deg, #f7f1e8, #efe4d4);
      color: #2f241b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .page {
      width: 100%;
      max-width: 1180px;
      min-height: 680px;
      background: rgba(255, 252, 247, 0.78);
      border: 1px solid rgba(80, 58, 40, 0.10);
      border-radius: 28px;
      padding: 42px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 30px 80px rgba(67, 48, 31, 0.08);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      letter-spacing: -0.5px;
    }

    .top-note {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.65;
      text-align: right;
      line-height: 1.7;
    }

    main {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 70px;
      align-items: center;
      padding: 70px 0;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 22px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(58px, 7vw, 100px);
      line-height: 0.96;
      letter-spacing: -3px;
      margin-bottom: 28px;
    }

    .subtitle {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      line-height: 1.5;
      color: #6d5847;
      max-width: 650px;
    }

    .status {
      margin-top: 34px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b533f;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8f6d4f;
    }

    .visual {
      min-height: 380px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: linear-gradient(145deg, #dfccb5, #f4e9dc);
      position: absolute;
      box-shadow: inset 0 0 80px rgba(255,255,255,0.35);
    }

    .cat {
      position: relative;
      z-index: 2;
      font-size: 170px;
      filter: drop-shadow(0 18px 24px rgba(59, 39, 22, 0.16));
    }

    .ring {
      position: absolute;
      width: 460px;
      height: 460px;
      border: 1px solid rgba(80, 58, 40, 0.18);
      border-radius: 50%;
    }

    footer {
      border-top: 1px solid rgba(80, 58, 40, 0.12);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #816b59;
    }

    @media (max-width: 850px) {
      .page {
        padding: 28px;
        min-height: auto;
      }

      header {
        align-items: flex-start;
      }

      .top-note {
        display: none;
      }

      main {
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 60px 0 40px;
      }

      h1 {
        font-size: 58px;
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 20px;
      }

      .visual {
        min-height: 290px;
      }

      .circle {
        width: 260px;
        height: 260px;
      }

      .ring {
        width: 320px;
        height: 320px;
      }

      .cat {
        font-size: 125px;
      }

      footer {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <section class="page">
    <header>
      <div class="brand">Voof Hunter</div>

      <div class="top-note">
        Premium Pet Food & Lifestyle<br />
        Coming Soon
      </div>
    </header>

    <main>
      <div class="content">
        <div class="eyebrow">A new journey is coming</div>

        <h1>
          Born to Hunt.<br />
          Made for More.
        </h1>

        <p class="subtitle">
          A premium pet food and lifestyle brand created for pets
          who deserve more from every day.
        </p>

        <div class="status">
          <span class="dot"></span>
          Coming Soon
        </div>
      </div>

      <div class="visual">
        <div class="ring"></div>
        <div class="circle"></div>
        <div class="cat">🐈</div>
      </div>
    </main>

    <footer>
      <div>voofhunter.com</div>
      <div>Good Food. Brighter Lives.</div>
    </footer>
  </section>
</body>
</html>
